<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易尚彤 | Louis · 个人名片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: url('images/Betty-1.PNG') center 80% / cover no-repeat fixed;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.2rem;
      line-height: 1.6;
      color: #1e293b;
    }

    .card {
      position: relative;   /* 让右上角按钮相对卡片定位 */
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 2.2rem;
      padding: 2.8rem 2.6rem;
      box-shadow:
        0 30px 55px -22px rgba(0, 25, 55, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.55);
      box-shadow:
        0 40px 65px -26px rgba(0, 30, 60, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    }

    /* ---------- 卡片右上角音乐按钮 ---------- */
    .music-corner {
      position: absolute;
      top: 1.6rem;
      right: 1.6rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.6rem;
      z-index: 10;
    }

    .music-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 25px -10px rgba(37, 99, 235, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .music-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 18px 35px -12px rgba(124, 58, 237, 0.7);
    }

    .music-btn.playing .music-icon {
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ---------- 音乐选择菜单 ---------- */
    .music-menu {
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 0.5rem;
      display: none;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 210px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
    }

    .music-menu.open { display: flex; }

    .music-menu-title {
      font-size: 0.72rem;
      color: #94a3b8;
      padding: 0.35rem 0.75rem;
      letter-spacing: 0.06em;
    }

    .music-option {
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 0.88rem;
      text-align: left;
      padding: 0.5rem 0.85rem;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .music-option:hover {
      background: rgba(124, 58, 237, 0.28);
      color: #fff;
    }

    .music-option.active {
      background: rgba(37, 99, 235, 0.4);
      color: #fff;
      font-weight: 600;
    }

    /* ---------- 头部 ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      padding-right: 4rem;   /* 给右上角按钮留空间 */
    }

    .avatar {
      flex-shrink: 0;
      width: 5.6rem;
      height: 5.6rem;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 15px 28px -10px rgba(59, 130, 246, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card:hover .avatar {
      transform: scale(1.03);
      box-shadow: 0 20px 32px -10px rgba(99, 102, 241, 0.45);
    }

    .name-block { flex: 1; min-width: 180px; }

    .name {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0b1e33;
      line-height: 1.25;
      margin-bottom: 0.35rem;
      text-shadow: 0 2px 12px rgba(255, 255, 255, 0.85), 0 0 4px rgba(255, 255, 255, 0.9);
    }

    .name .en {
      font-size: 1.4rem;
      font-weight: 500;
      color: #2d3f57;
      letter-spacing: 0.02em;
      margin-left: 0.4rem;
    }

    .subtitle {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1d4ed8;
      background: rgba(255, 255, 255, 0.7);
      padding: 0.3rem 1.1rem;
      border-radius: 40px;
      border: 1px solid rgba(37, 99, 235, 0.25);
      letter-spacing: 0.2px;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.6rem;
      padding: 1.2rem 0 1.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.55);
      margin-bottom: 2rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.98rem;
      color: #0f172a;
      text-decoration: none;
      transition: color 0.2s ease;
      font-weight: 500;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.85);
    }

    .contact-item .icon { font-size: 1.1rem; line-height: 1; opacity: 0.9; }
    .contact-item:hover { color: #2563eb; }

    .action-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn-pdf {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      padding: 1rem 1.6rem;
      border-radius: 60px;
      text-decoration: none;
      box-shadow: 0 15px 30px -12px rgba(37, 99, 235, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-pdf:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 38px -14px rgba(37, 99, 235, 0.65);
      filter: brightness(1.05);
    }

    .btn-niko {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      padding: 1rem 1.6rem;
      border-radius: 60px;
      text-decoration: none;
      box-shadow: 0 15px 30px -12px rgba(15, 23, 42, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-niko:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 38px -14px rgba(15, 23, 42, 0.7);
      filter: brightness(1.1);
    }

    .btn-pdf .icon,
    .btn-niko .icon { font-size: 1.25rem; }

    .footer {
      margin-top: 2rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      font-size: 0.82rem;
      color: #334155;
      text-align: center;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.85);
    }

    @media (max-width: 600px) {
      .card { padding: 2rem 1.4rem; border-radius: 1.8rem; }
      .header { gap: 1.2rem; flex-direction: column; align-items: flex-start; padding-right: 3rem; }
      .avatar { width: 4.4rem; height: 4.4rem; }
      .name { font-size: 1.7rem; }
      .name .en { font-size: 1.15rem; }
      .contact-row { flex-direction: column; gap: 0.6rem; }
      .music-corner { top: 1rem; right: 1rem; }
      .music-btn { width: 40px; height: 40px; font-size: 1.1rem; }
      .music-menu { min-width: 180px; }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 右上角：音乐按钮 + 菜单 -->
    <div class="music-corner">
      <button id="music-btn" class="music-btn" aria-label="选择背景音乐">
        <span class="music-icon">♪</span>
      </button>
      <div id="music-menu" class="music-menu">
        <div class="music-menu-title">选择背景音乐</div>
        <button class="music-option" data-src="music/C418%20-%20Moog%20City.mp3">🎵 C418 - Moog City</button>
        <button class="music-option" data-src="music/C418%20-%20Sweden.mp3">🎵 C418 - Sweden</button>
        <button class="music-option" data-src="">⏹ 停止播放</button>
      </div>
    </div>

    <div class="header">
      <div class="avatar">
        <img src="images/FLC-1.JPG" alt="易尚彤">
      </div>
      <div class="name-block">
        <h1 class="name">
          易尚彤 <span class="en">| Louis</span>
        </h1>
        <span class="subtitle">金融科技 · 本科在读</span>
      </div>
    </div>

    <div class="contact-row">
      <a href="tel:+8618677161438" class="contact-item">
        <span class="icon">📞</span> +86 186-7716-1438
      </a>
      <a href="mailto:ystkaigua@outlook.com" class="contact-item">
        <span class="icon">📧</span> ystkaigua@outlook.com
      </a>
    </div>

    <div class="action-section">
      <a href="LouisJay.pdf" class="btn-pdf" download>
        <span class="icon">📄</span> 下载简历（PDF）
      </a>
      <a href="niko.html" class="btn-niko">
        <span class="icon">🪑</span> 真拿你没办法，坐好喽
      </a>
    </div>

    <div class="footer">
      易尚彤 · Louis &nbsp;|&nbsp; 金融科技 · 数据分析 · 技术交叉应用
    </div>

  </div>

  <!-- 音乐 -->
  <audio id="bgm" loop preload="auto"></audio>

  <script>
    (function () {
      var audio = document.getElementById('bgm');
      var btn = document.getElementById('music-btn');
      var menu = document.getElementById('music-menu');
      var options = menu.querySelectorAll('.music-option');

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        menu.classList.toggle('open');
      });

      options.forEach(function (opt) {
        opt.addEventListener('click', function (e) {
          e.stopPropagation();
          var src = opt.getAttribute('data-src');

          // 停止播放
          if (!src) {
            audio.pause();
            audio.currentTime = 0;
            btn.classList.remove('playing');
            options.forEach(function (o) { o.classList.remove('active'); });
            menu.classList.remove('open');
            return;
          }

          // 点同一首：暂停/继续
          if (audio.src.indexOf(src) !== -1 && !audio.paused) {
            audio.pause();
            btn.classList.remove('playing');
            opt.classList.remove('active');
            return;
          }

          // 切歌播放
          audio.src = src;
          audio.play().then(function () {
            btn.classList.add('playing');
            options.forEach(function (o) { o.classList.remove('active'); });
            opt.classList.add('active');
            menu.classList.remove('open');
          }).catch(function (err) {
            console.warn('播放失败：', err);
          });
        });
      });

      // 点击页面其他处关闭菜单
      document.addEventListener('click', function () {
        menu.classList.remove('open');
      });
    })();
  </script>

</body>
</html>
