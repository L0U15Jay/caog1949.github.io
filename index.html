<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易尚彤 | Louis · 个人名片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f0f4fe 0%, #e6ecf9 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.2rem;
      line-height: 1.6;
      color: #1e293b;
    }

    .card {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 2.2rem;
      padding: 2.8rem 2.6rem;
      box-shadow:
        0 30px 55px -22px rgba(0, 25, 55, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
        0 0 0 1px rgba(148, 163, 184, 0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 40px 65px -26px rgba(0, 30, 60, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.85) inset,
        0 0 0 1px rgba(148, 163, 184, 0.18);
    }

    /* ---------- 头部 ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .avatar {
      flex-shrink: 0;
      width: 5.6rem;
      height: 5.6rem;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 15px 28px -10px rgba(59, 130, 246, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card:hover .avatar {
      transform: scale(1.03);
      box-shadow: 0 20px 32px -10px rgba(99, 102, 241, 0.45);
    }

    .name-block {
      flex: 1;
      min-width: 180px;
    }

    .name {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0b1e33;
      line-height: 1.25;
      margin-bottom: 0.35rem;
    }

    .name .en {
      font-size: 1.4rem;
      font-weight: 500;
      color: #4a5b73;
      letter-spacing: 0.02em;
      margin-left: 0.4rem;
    }

    .subtitle {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 500;
      color: #2563eb;
      background: rgba(37, 99, 235, 0.08);
      padding: 0.3rem 1.1rem;
      border-radius: 40px;
      border: 1px solid rgba(37, 99, 235, 0.18);
      letter-spacing: 0.2px;
    }

    /* ---------- 联系方式 ---------- */
    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.6rem;
      padding: 1.2rem 0 1.6rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
      margin-bottom: 2rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.98rem;
      color: #1e293b;
      text-decoration: none;
      transition: color 0.2s ease;
      font-weight: 450;
    }

    .contact-item .icon {
      font-size: 1.1rem;
      line-height: 1;
      opacity: 0.85;
    }

    .contact-item:hover {
      color: #2563eb;
    }

    /* ---------- PDF 下载区域 ---------- */
    .download-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2rem;
      padding: 1rem 0 0.5rem;
    }

    .download-btn {
      flex: 1 1 280px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      padding: 1rem 1.6rem;
      border-radius: 60px;
      text-decoration: none;
      box-shadow: 0 15px 30px -12px rgba(37, 99, 235, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .download-btn .icon {
      font-size: 1.25rem;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 38px -14px rgba(37, 99, 235, 0.65);
      filter: brightness(1.05);
    }

    /* 右侧两张配图 */
    .side-images {
      display: flex;
      gap: 0.9rem;
      flex-shrink: 0;
    }

    .side-images img {
      width: 4.5rem;
      height: 4.5rem;
      object-fit: cover;
      border-radius: 1.1rem;
      box-shadow: 0 10px 20px -8px rgba(30, 41, 59, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.9);
      transition: transform 0.2s ease;
    }

    .side-images img:hover {
      transform: scale(1.06);
    }

    /* ---------- 页脚 ---------- */
    .footer {
      margin-top: 2rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      font-size: 0.82rem;
      color: #94a3b8;
      text-align: center;
      letter-spacing: 0.3px;
    }

    /* ---------- 响应式 ---------- */
    @media (max-width: 600px) {
      .card {
        padding: 2rem 1.4rem;
        border-radius: 1.8rem;
      }

      .header {
        gap: 1.2rem;
        flex-direction: column;
        align-items: flex-start;
      }

      .avatar {
        width: 4.4rem;
        height: 4.4rem;
      }

      .name {
        font-size: 1.7rem;
      }

      .name .en {
        font-size: 1.15rem;
      }

      .contact-row {
        flex-direction: column;
        gap: 0.6rem;
      }

      .download-section {
        flex-direction: column;
        align-items: stretch;
        gap: 1.2rem;
      }

      .side-images {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 头部：头像 + 姓名 + 身份 -->
    <div class="header">
      <div class="avatar">
        <img src="FLC-1.JPG" alt="易尚彤">
      </div>
      <div class="name-block">
        <h1 class="name">
          易尚彤 <span class="en">| Louis</span>
        </h1>
        <span class="subtitle">金融科技 · 本科在读</span>
      </div>
    </div>

    <!-- 联系方式 -->
    <div class="contact-row">
      <a href="tel:+8618677161438" class="contact-item">
        <span class="icon">📞</span> +86 186-7716-1438
      </a>
      <a href="mailto:ystkaigua@outlook.com" class="contact-item">
        <span class="icon">📧</span> ystkaigua@outlook.com
      </a>
    </div>

    <!-- PDF 下载区域 -->
    <div class="download-section">
      <a href="LouisJay.pdf" class="download-btn" download>
        <span class="icon">📄</span> 下载简历（PDF）
      </a>

      <!-- 右侧两张配图，不想用就删掉这个 div -->
      <div class="side-images">
        <img src="FLC-2.JPG" alt="配图 1">
        <img src="FLC-3.JPG" alt="配图 2">
      </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
      易尚彤 · Louis &nbsp;|&nbsp; 金融科技 · 数据分析 · 技术交叉应用
    </div>

  </div>
</body>
</html>
